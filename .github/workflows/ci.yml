name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.2'

      - name: Run Go tests
        run: go test ./...

      - name: Regenerate Solidity fixtures
        run: bash test/generate_sol_pb.sh

      - name: Regenerate benchmark fixtures
        run: bash test/solidity/test/bench/regen.sh

      - name: Verify generated Solidity is up to date
        run: |
          git diff --exit-code -- test/solidity/src/lib
          git diff --exit-code -- test/solidity/test/bench/new

  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.2'

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: '1.5.1'

      - name: Regenerate Solidity and protobuf fixtures
        run: bash test/generate_sol_pb.sh

      - name: Regenerate benchmark fixtures
        run: bash test/solidity/test/bench/regen.sh

      - name: Check formatting
        working-directory: test/solidity
        run: forge fmt --check

      - name: Build Solidity tests
        working-directory: test/solidity
        run: forge build

      - name: Run Solidity tests
        working-directory: test/solidity
        run: forge test -vv